name: Omagara v1.9.3 isolated OWL validation

on:
  push:
    branches:
      - test/omagara-v1.9.3-animation-list
    paths:
      - faces/dillacorn/omagara/face.owl
      - .github/workflows/omagara-v1.9.3-test.yml

permissions:
  contents: read

jobs:
  owl-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Omagara with the repository OWL reviewer
        run: java -jar tools/owl.jar review . faces/dillacorn/omagara/face.owl
